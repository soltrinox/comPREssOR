[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-compressor"
version = "0.1.4"
description = "Latent State Persistence Engine and Cursor SDK A/B harness for compressed chat gists."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.0"]
hf = ["torch", "transformers", "sentence-transformers"]
sdk = ["cursor-sdk"]

[project.scripts]
chat-compressor-hook = "chat_compressor.hook_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
